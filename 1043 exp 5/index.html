
<!DOCTYPE html>
<html>
<head>
    <title>ComicVerse - Signup</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

/* BASIC RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    font-family: Arial, sans-serif;
    background-color: #fff5e6;
    color: #241d27;
    line-height: 1.6;
}

/* HEADER */
header {
    background-color: #241d27;
    color: white;
    text-align: center;
    padding: 25px;
}

header h1 {
    color: #f5c85b;
    font-size: 36px;
    letter-spacing: 3px;
}

/* NAVIGATION */
nav {
    background-color: #b8323c;
    padding: 15px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 15px;
    font-weight: bold;
}

/* HERO */
.hero {
    background-color: #f5c85b;
    text-align: center;
    padding: 35px 15px;
}

.hero h2 {
    font-size: 28px;
}

/* MAIN CONTAINER */
.container {
    display: flex;
    justify-content: center;
    padding: 30px;
}

/* SIGNUP FORM */
.signup {
    background-color: white;
    width: 450px;
    padding: 30px;
    border: 3px solid #241d27;
    border-radius: 15px;
    box-shadow: 6px 6px 0px #b8323c;
}

.signup h2 {
    color: #b8323c;
    text-align: center;
    margin-bottom: 10px;
}

.signup p {
    text-align: center;
    margin-bottom: 20px;
}

/* INPUT FIELDS */
.signup input {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border: 2px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

/* INPUT FOCUS */
.signup input:focus {
    border: 2px solid #b8323c;
    outline: none;
    background-color: #fff9e8;
}

/* ERROR MESSAGES */
.error {
    color: red;
    font-size: 13px;
    display: block;
    margin-bottom: 10px;
}

/* BUTTON */
button {
    width: 100%;
    background-color: #b8323c;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 7px;
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background-color: #241d27;
}

/* SUCCESS MESSAGE */
#success {
    color: green;
    text-align: center;
    font-weight: bold;
    margin-top: 15px;
}

/* FOOTER */
footer {
    background-color: #241d27;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 25px;
}

/* RESPONSIVE DESIGN */
@media (max-width: 480px) {

    header h1 {
        font-size: 27px;
    }

    .signup {
        width: 100%;
        padding: 20px;
    }

    .container {
        padding: 15px;
    }

    .hero h2 {
        font-size: 22px;
    }
}

    </style>
</head>

<body>

<!-- HEADER -->
<header>
    <h1>COMICVERSE</h1>
    <p>Your Universe of Comics!</p>
</header>

<!-- NAVIGATION -->
<nav>
    <a href="#home">Home</a>
    <a href="#signup">Sign Up</a>
</nav>

<!-- HERO SECTION -->
<section class="hero" id="home">
    <h2>JOIN THE COMICVERSE CLUB!</h2>
    <p>Create your account and explore exciting comic collections.</p>
</section>

<!-- SIGNUP FORM -->
<div class="container">

    <div class="signup" id="signup">

        <h2>Customer Registration</h2>

        <p>Enter your details to become a ComicVerse member!</p>

        <form id="signupForm" novalidate>

            <!-- NAME -->
            <label>Name</label>

            <input type="text"
            id="name"
            placeholder="Enter your name">

            <span class="error" id="nameError"></span>


            <!-- EMAIL -->
            <label>Email</label>

            <input type="email"
            id="email"
            placeholder="Enter your email">

            <span class="error" id="emailError"></span>


            <!-- PASSWORD -->
            <label>Password</label>

            <input type="password"
            id="password"
            placeholder="Enter your password">

            <span class="error" id="passError"></span>


            <!-- SUBMIT BUTTON -->
            <button type="submit">Sign Up</button>

            <p id="success"></p>

        </form>

    </div>

</div>

<!-- FOOTER -->
<footer>
    <p>Thank you for visiting ComicVerse!</p>
    <p>© 2026 ComicVerse | All Rights Reserved</p>
</footer>


<script>

/* GET FORM ELEMENTS */
const form = document.getElementById("signupForm");

const nameInput = document.getElementById("name");

const emailInput = document.getElementById("email");

const passwordInput = document.getElementById("password");


/* CHECK EMPTY VALUE */
function isEmpty(value) {
    return value.trim() === "";
}


/* CHECK EMAIL FORMAT */
function isValidEmail(email) {

    const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    return pattern.test(email);

}


/* CHECK PASSWORD LENGTH */
function isStrongPassword(pw) {

    return pw.length >= 8;

}


/* DISPLAY ERROR MESSAGE */
function showError(id, message) {

    document.getElementById(id).textContent = message;

}


/* CLEAR OLD ERRORS */
function clearErrors() {

    showError("nameError", "");

    showError("emailError", "");

    showError("passError", "");

    document.getElementById("success").textContent = "";

}


/* VALIDATE THE FORM */
function validateForm() {

    let valid = true;

    clearErrors();

    /* NAME VALIDATION */
    const name = nameInput.value.trim();

    if (isEmpty(name)) {

        showError("nameError", "Name is required");

        valid = false;

    } else if (name.length < 3) {

        showError("nameError", "Enter at least 3 characters");

        valid = false;

    } else {

        console.log("Name is valid");

    }


    /* EMAIL VALIDATION */
    const email = emailInput.value.trim();

    if (isEmpty(email)) {

        showError("emailError", "Email is required");

        valid = false;

    } else if (!isValidEmail(email)) {

        showError("emailError", "Enter a valid email address");

        valid = false;

    } else {

        console.log("Email is valid");

    }


    /* PASSWORD VALIDATION */
    const password = passwordInput.value;

    if (isEmpty(password)) {

        showError("passError", "Password is required");

        valid = false;

    } else if (!isStrongPassword(password)) {

        showError("passError", "Minimum 8 characters required");

        valid = false;

    } else {

        console.log("Password is valid");

    }

    return valid;

}


/* HANDLE FORM SUBMISSION */
form.addEventListener("submit", function(e) {

    if (!validateForm()) {

        e.preventDefault();

    } else {

        e.preventDefault();

        document.getElementById("success").textContent =
            "Signup successful! Welcome to ComicVerse!";

    }

});

</script>

</body>
</html>
